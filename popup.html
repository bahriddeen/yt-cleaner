<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YouTube Cleaner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0f0f0f;
    --surface:  #1a1a1a;
    --border:   #2a2a2a;
    --text:     #f0f0f0;
    --muted:    #888;
    --accent:   #ff3c3c;
    --accent2:  #ff6b35;
    --on:       #22c55e;
    --radius:   8px;
    --font:     'DM Sans', sans-serif;
    --mono:     'DM Mono', monospace;
  }

  body {
    width: 320px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    padding-bottom: 12px;
  }

  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, #1a0000 0%, #1a0a00 100%);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo {
    width: 28px; height: 28px;
    background: var(--accent);
    border-radius: 6px;
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .logo svg { width: 16px; height: 16px; fill: #fff; }
  .header-text h1 {
    font-size: 14px; font-weight: 600; letter-spacing: -0.2px;
  }
  .header-text p {
    font-size: 11px; color: var(--muted); margin-top: 1px;
  }

  /* ── Stats bar ── */
  .stats-bar {
    display: flex;
    gap: 1px;
    background: var(--border);
    border-bottom: 1px solid var(--border);
  }
  .stat {
    flex: 1;
    background: var(--surface);
    padding: 10px 8px;
    text-align: center;
  }
  .stat-num {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 500;
    color: var(--accent);
    line-height: 1;
  }
  .stat-label {
    font-size: 10px;
    color: var(--muted);
    margin-top: 3px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* ── Section ── */
  .section {
    padding: 10px 16px 4px;
  }
  .section-title {
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  /* ── Toggle row ── */
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }
  .toggle-row:last-child { border-bottom: none; }
  .toggle-row:hover .toggle-label { color: #fff; }

  .toggle-label {
    font-size: 13px;
    color: var(--text);
    transition: color 0.15s;
    flex: 1;
  }
  .toggle-label small {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
  }

  /* The actual toggle switch */
  .switch {
    position: relative;
    width: 36px; height: 20px;
    flex-shrink: 0;
    margin-left: 12px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0;
    background: #333;
    border-radius: 20px;
    transition: background 0.2s;
    cursor: pointer;
  }
  .slider::before {
    content: '';
    position: absolute;
    width: 14px; height: 14px;
    left: 3px; top: 3px;
    background: #666;
    border-radius: 50%;
    transition: transform 0.2s, background 0.2s;
  }
  input:checked + .slider { background: #1a3d20; }
  input:checked + .slider::before {
    transform: translateX(16px);
    background: var(--on);
  }

  /* ── Blocklist ── */
  .blocklist-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-top: 4px;
  }
  .blocklist-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    padding: 8px;
    min-height: 36px;
    max-height: 100px;
    overflow-y: auto;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #2a1010;
    color: #ff8a8a;
    border: 1px solid #4a1a1a;
    border-radius: 4px;
    padding: 2px 6px 2px 7px;
    font-size: 11px;
    font-family: var(--mono);
  }
  .tag-remove {
    cursor: pointer;
    color: #ff4444;
    font-size: 13px;
    line-height: 1;
    padding: 0 1px;
    opacity: 0.7;
  }
  .tag-remove:hover { opacity: 1; }

  .blocklist-input-row {
    display: flex;
    border-top: 1px solid var(--border);
  }
  #blocklistInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 10px;
  }
  #blocklistInput::placeholder { color: #444; }
  #blocklistAdd {
    background: var(--accent);
    border: none;
    color: #fff;
    font-family: var(--font);
    font-size: 12px;
    font-weight: 600;
    padding: 0 12px;
    cursor: pointer;
    transition: background 0.15s;
  }
  #blocklistAdd:hover { background: #e03030; }

  .blocklist-hint {
    font-size: 10px;
    color: var(--muted);
    margin-top: 5px;
    line-height: 1.4;
  }

  /* ── Footer ── */
  .popup-footer {
    margin-top: 10px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .version { font-size: 10px; color: #444; font-family: var(--mono); }
  .reset-btn {
    font-size: 10px;
    color: #555;
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--font);
    padding: 2px 0;
    transition: color 0.15s;
  }
  .reset-btn:hover { color: var(--accent); }

  /* Saved flash */
  .saved-flash {
    position: fixed;
    bottom: 10px; left: 50%;
    transform: translateX(-50%) translateY(30px);
    background: var(--on);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 5px 14px;
    border-radius: 20px;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
  }
  .saved-flash.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
  </div>
  <div class="header-text">
    <h1>YouTube Cleaner</h1>
    <p>Sync'd across all your devices</p>
  </div>
</div>

<!-- Stats bar -->
<div class="stats-bar">
  <div class="stat">
    <div class="stat-num" id="statHidden">–</div>
    <div class="stat-label">Hidden today</div>
  </div>
  <div class="stat">
    <div class="stat-num" id="statShorts">–</div>
    <div class="stat-label">Shorts removed</div>
  </div>
  <div class="stat">
    <div class="stat-num" id="statBlocked">–</div>
    <div class="stat-label">Blocklist hits</div>
  </div>
</div>

<!-- Toggles: Feed -->
<div class="section">
  <div class="section-title">Feed</div>



  <label class="toggle-row">
    <span class="toggle-label">
      Remove Shorts
      <small>Shelves, cards, sidebar button</small>
    </span>
    <div class="switch">
      <input type="checkbox" id="removeShorts" />
      <span class="slider"></span>
    </div>
  </label>

  <label class="toggle-row">
    <span class="toggle-label">
      Keep Mix &amp; playlist cards
      <small>Auto-generated mixes stay visible</small>
    </span>
    <div class="switch">
      <input type="checkbox" id="keepMixPlaylists" />
      <span class="slider"></span>
    </div>
  </label>
</div>

<!-- Toggles: Sidebar -->
<div class="section">
  <div class="section-title">Sidebar</div>

  <label class="toggle-row">
    <span class="toggle-label">
      Remove Explore / Trending sections
      <small>Gaming, Live, Fashion, etc.</small>
    </span>
    <div class="switch">
      <input type="checkbox" id="removeSidebarSections" />
      <span class="slider"></span>
    </div>
  </label>

  <label class="toggle-row">
    <span class="toggle-label">
      Remove footer links
      <small>About, Press, Terms, Privacy…</small>
    </span>
    <div class="switch">
      <input type="checkbox" id="removeSidebarFooter" />
      <span class="slider"></span>
    </div>
  </label>
</div>

<!-- Toggles: Top nav -->
<div class="section">
  <div class="section-title">Top bar</div>

  <label class="toggle-row">
    <span class="toggle-label">
      Remove Create (+) button
    </span>
    <div class="switch">
      <input type="checkbox" id="removeCreateButton" />
      <span class="slider"></span>
    </div>
  </label>
</div>

<!-- Blocklist -->
<div class="section">
  <div class="section-title">Keyword / Channel blocklist</div>
  <div class="blocklist-wrap">
    <div class="blocklist-tags" id="blocklistTags"></div>
    <div class="blocklist-input-row">
      <input id="blocklistInput" type="text" placeholder="channel name or keyword…" maxlength="80" />
      <button id="blocklistAdd">Add</button>
    </div>
  </div>
  <p class="blocklist-hint">Any card whose title or channel name contains a blocked term is hidden.</p>
</div>

<!-- Footer -->
<div class="popup-footer">
  <span class="version">v4.0.0</span>
  <button class="reset-btn" id="resetBtn">Reset to defaults</button>
</div>

<div class="saved-flash" id="savedFlash">Saved ✓</div>

<script src="popup.js"></script>
</body>
</html>
